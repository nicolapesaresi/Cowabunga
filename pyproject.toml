[tool.poetry]
name = "cowabunga"
version = "0.1.0"
description = "Help cows cross the river safely"
authors = ["Nicola Pesaresi"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
numpy = "^2.2.4"
pygame = "^2.6.1"
pre-commit = "^4.5.0"
pandas = "^2.3.3"


[tool.poetry.group.agent.dependencies]
torch = "^2.9.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
